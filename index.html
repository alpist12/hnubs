<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="HNUBS 방송국 내부 일정 및 인원 관리 시스템">
  <title>HNUBS 관리 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="./styles.css?v=20261117-ws7">
  <link rel="stylesheet" href="./camera/styles.css?v=20261117-ws7">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <nav class="rail" aria-label="주 메뉴">
    <button class="ws" type="button" data-route="home" aria-label="HNUBS 방송국 홈으로 이동">
      <span class="ws-logo" aria-hidden="true">H</span>
      <span class="ws-name"><strong>HNUBS 방송국</strong><small id="ws-meta">시범 운영</small></span>
    </button>
    <div class="ws-tools">
      <div class="hn-search-wrap">
        <label class="hn-search" aria-label="전체 검색">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="global-search" type="search" placeholder="검색" autocomplete="off"
            role="combobox" aria-expanded="false" aria-controls="search-results">
          <kbd>⌘K</kbd>
        </label>
        <div id="search-results" class="hn-search-panel" role="listbox" aria-label="검색 결과" hidden></div>
      </div>
      <button class="ws-new" type="button" data-action="new-shoot" aria-label="일정 등록" title="일정 등록"><span data-icon="plus"></span></button>
    </div>
    <button type="button" data-route="home"><span data-icon="home"></span><span>홈</span></button>
    <button type="button" data-route="schedule"><span data-icon="calendar"></span><span>일정</span></button>
    <button type="button" data-route="drive"><span data-icon="folder"></span><span>공유드라이브</span></button>
    <button type="button" data-route="notices"><span data-icon="bell"></span><span>공지사항</span><em class="rail-cnt" id="rail-notices"></em></button>
    <p class="rail-sep"><span>프로젝트</span><button type="button" data-route="projects" aria-label="프로젝트 전체 보기" title="프로젝트 전체 보기">+</button></p>
    <div id="rail-projects" class="rail-projects"></div>
    <p class="rail-sep"><span>메이커스페이스</span></p>
    <button type="button" data-route="script"><span data-icon="file"></span><span>AI 대본 분석</span></button>
    <button type="button" data-route="shorts"><span data-icon="film"></span><span>쇼츠</span></button>
    <button type="button" data-route="camera"><span data-icon="camera"></span><span>카메라 구도</span></button>
    <div class="rail-foot">
      <button type="button" data-route="settings"><span data-icon="settings"></span><span>설정</span></button>
      <span id="tally" class="a-tally" role="status" aria-live="polite"><i aria-hidden="true"></i>OFF AIR</span>
    </div>
  </nav>

  <header class="hn-header">
    <div class="hn-header-inner">
      <button class="hn-brand top-brand" type="button" data-route="home" aria-label="HNUBS 홈으로 이동">
        <span class="ws-logo" aria-hidden="true">H</span>
        <strong>HNUBS</strong>
      </button>
      <nav class="crumb" id="crumb" aria-label="현재 위치"><span>HNUBS 방송국</span><i aria-hidden="true">/</i><b aria-current="page">홈</b></nav>

      <div class="hn-header-actions">
        <button class="hn-icon-button" id="notification-button" type="button" aria-label="알림 열기" aria-expanded="false">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <i class="hn-dot" aria-hidden="true"></i>
        </button>
        <button class="a-btn top-new" type="button" data-action="new-shoot"><span data-icon="plus"></span>일정 등록</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="app" class="hn-main" aria-live="polite"></div>
  </main>

  <nav class="mobile-nav" aria-label="모바일 주요 메뉴">
    <button type="button" data-route="home"><span data-icon="home"></span><span>홈</span></button>
    <button type="button" data-route="schedule"><span data-icon="calendar"></span><span>일정</span></button>
    <button type="button" data-route="notices"><span data-icon="bell"></span><span>공지사항</span></button>
    <button type="button" data-route="drive"><span data-icon="folder"></span><span>드라이브</span></button>
    <button type="button" id="mobile-more"><span data-icon="menu"></span><span>더보기</span></button>
  </nav>

  <div class="popover notification-popover" id="notification-popover" hidden>
    <div class="popover-head"><strong>알림</strong><button type="button" data-action="close-popover" aria-label="알림 닫기"><span data-icon="x"></span></button></div>
    <div id="notification-list"></div>
    <button class="text-link popover-footer" type="button" data-route="shoots">모든 일정 보기 <span data-icon="arrow-right"></span></button>
  </div>

  <div class="mobile-sheet-backdrop" id="mobile-menu-backdrop" hidden></div>
  <aside class="mobile-menu-sheet" id="mobile-menu" aria-label="전체 메뉴" aria-hidden="true">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="mobile-profile"><span class="ws-logo" aria-hidden="true">H</span><span><strong>HNUBS 방송국</strong><small>방송국 워크스페이스</small></span><button class="icon-button" type="button" data-action="close-mobile-menu" aria-label="메뉴 닫기"><span data-icon="x"></span></button></div>
    <div class="mobile-menu-grid">
      <button type="button" data-route="script"><span data-icon="file"></span>AI 대본 분석</button>
      <button type="button" data-route="shorts"><span data-icon="film"></span>쇼츠</button>
      <button type="button" data-route="camera"><span data-icon="camera"></span>카메라 구도</button>
      <button type="button" data-route="drive"><span data-icon="folder"></span>공유드라이브</button>
      <button type="button" data-route="notices"><span data-icon="bell"></span>공지사항</button>
      <button type="button" data-route="settings"><span data-icon="settings"></span>설정</button>
    </div>
  </aside>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="상세 정보">
    <div id="drawer-content"></div>
  </aside>

  <aside class="air" aria-label="Air(에어) AI 도우미">
    <div id="air-bubble" class="air-bubble" role="status"></div>
    <section id="air-chat" class="air-chat" aria-label="Air 대화창" hidden>
      <header class="air-head">
        <span class="air-mark" aria-hidden="true">✦</span>
        <span class="air-who"><b>Air<small>에어</small></b><small id="air-status">AI 서버 확인 중</small></span>
        <button id="air-close" class="air-close" type="button" aria-label="닫기">×</button>
      </header>
      <div id="air-messages" class="air-messages"></div>
      <form id="air-form" class="air-form">
        <textarea id="air-input" rows="1" placeholder="무엇이든 물어보세요" autocomplete="off"></textarea>
        <button type="submit" aria-label="전송"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39 1.2L4 11l9 1-9 1-1.99 6.2a1 1 0 0 0 1.39 1.2z"/></svg></button>
      </form>
    </section>
    <button id="air-button" class="air-button" type="button" aria-label="Air(에어) 열기" aria-expanded="false">✦</button>
  </aside>

  <div id="air-confirm" class="air-confirm" hidden>
    <section class="air-confirm-card" role="dialog" aria-modal="true" aria-labelledby="air-confirm-title">
      <h2 id="air-confirm-title"><span class="air-confirm-icon" aria-hidden="true">✦</span>일정을 추가할까요?</h2>
      <pre id="air-confirm-details"></pre>
      <div class="air-confirm-actions">
        <button id="air-confirm-cancel" type="button" class="air-confirm-cancel">취소</button>
        <button id="air-confirm-ok" type="button" class="air-confirm-ok">추가</button>
      </div>
    </section>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="./api-config.js?v=20261111-drive"></script>
  <script src="./app.js?v=20261117-ws7"></script>
</body>
</html>
