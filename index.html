<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="HNUBS 방송국 내부 일정 및 인원 관리 시스템">
  <title>HNUBS 관리 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="./styles.css?v=20261117-compact">
  <link rel="stylesheet" href="./camera/styles.css?v=20261117-ws7">
  <link rel="stylesheet" href="./dashboard.css?v=20261118-lavender">
</head>
<body class="lavender-workspace">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <aside class="ld-sidebar" aria-label="워크스페이스 메뉴">
    <button class="ld-brand" type="button" data-route="home" aria-label="HNUBS 대시보드">
      <img src="./assets/art/brand-broadcast.svg" alt="" width="58" height="58">
      <span><strong>HNUBS</strong><small>한밭대학교<br>신문방송국<br>내부 운영 시스템</small></span>
    </button>
    <nav class="ld-navigation" aria-label="주 메뉴">
      <button type="button" data-route="home"><span data-icon="home"></span>대시보드</button>
      <details class="ld-production"><summary><span data-icon="film"></span>제작 관리<span data-icon="chevron-down"></span></summary>
        <div class="ld-subnav"><button type="button" data-route="projects">프로젝트</button><button type="button" data-route="script">AI 대본 분석</button><button type="button" data-route="shorts">쇼츠</button><button type="button" data-route="camera">카메라 구도</button></div>
      </details>
      <button type="button" data-route="schedule"><span data-icon="calendar"></span>일정</button>
      <button type="button" data-route="personal"><span data-icon="clock"></span>개인 일정</button>
      <button type="button" data-route="drive"><span data-icon="folder"></span>자료실</button>
      <button type="button" data-route="notices"><span data-icon="radio"></span>공지사항</button>
      <button type="button" data-route="people"><span data-icon="users"></span>국원 관리</button>
      <button type="button" data-route="settings"><span data-icon="settings"></span>설정</button>
    </nav>
    <div class="ld-sidebar-foot"><span id="tally" class="a-tally" role="status" aria-live="polite"><i aria-hidden="true"></i>OFF AIR</span><small>함께 만드는 좋은 방송</small></div>
  </aside>
  <header class="hn-header">
    <div class="hn-header-inner">
      <button id="mobile-more" class="hn-icon-button ld-mobile-menu" type="button" aria-label="전체 메뉴 열기"><span data-icon="menu"></span></button>
      <div class="hn-search-wrap">
        <label class="hn-search" aria-label="전체 검색"><span data-icon="search"></span><input id="global-search" type="search" placeholder="일정, 구성원, 공지 검색" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-results"><kbd>⌘K</kbd></label>
        <div id="search-results" class="hn-search-panel" role="listbox" aria-label="검색 결과" hidden></div>
      </div>
      <div class="hn-header-actions">
        <button class="hn-icon-button" id="notification-button" type="button" aria-label="알림 열기" aria-expanded="false"><span data-icon="bell"></span><i class="hn-dot" aria-hidden="true"></i></button>
        <button class="hn-icon-button ld-air-link" type="button" data-action="open-air" aria-label="Air AI 도우미 열기"><span data-icon="help-circle"></span></button>
        <div class="ld-workspace-identity"><span class="ld-identity-icon" aria-hidden="true"><span data-icon="users"></span></span><span><strong>HNUBS 방송국</strong><small id="ws-meta">공용 워크스페이스</small></span></div>
      </div>
    </div>
  </header>


  <main id="main" tabindex="-1">
    <div id="app" class="hn-main" aria-live="polite"></div>
  </main>

<div class="popover notification-popover" id="notification-popover" hidden>
    <div class="popover-head"><strong>알림</strong><button type="button" data-action="close-popover" aria-label="알림 닫기"><span data-icon="x"></span></button></div>
    <div id="notification-list"></div>
    <button class="text-link popover-footer" type="button" data-route="shoots">모든 일정 보기 <span data-icon="arrow-right"></span></button>
  </div>

  <div class="mobile-sheet-backdrop" id="mobile-menu-backdrop" hidden></div>
  <aside class="mobile-menu-sheet" id="mobile-menu" aria-label="전체 메뉴" aria-hidden="true">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="mobile-profile"><span class="ws-logo" aria-hidden="true">H</span><span><strong>HNUBS 방송국</strong><small>방송국 워크스페이스</small></span><button class="icon-button" type="button" data-action="close-mobile-menu" aria-label="메뉴 닫기"><span data-icon="x"></span></button></div>
    <div class="mobile-menu-grid"><button type="button" data-route="home"><span data-icon="home"></span>대시보드</button><button type="button" data-route="schedule"><span data-icon="calendar"></span>일정</button><button type="button" data-route="projects"><span data-icon="film"></span>프로젝트</button><button type="button" data-route="personal"><span data-icon="clock"></span>개인 일정</button>
      <button type="button" data-route="script"><span data-icon="file"></span>AI 대본 분석</button>
      <button type="button" data-route="shorts"><span data-icon="film"></span>쇼츠</button>
      <button type="button" data-route="camera"><span data-icon="camera"></span>카메라 구도</button>
      <button type="button" data-route="drive"><span data-icon="folder"></span>공유드라이브</button>
      <button type="button" data-route="notices"><span data-icon="bell"></span>공지사항</button>
      <button type="button" data-route="settings"><span data-icon="settings"></span>설정</button>
    </div>
  </aside>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawer-title" inert>
    <div id="drawer-content"></div>
  </aside>

  <aside class="air" aria-label="Air(에어) AI 도우미">
    <div id="air-bubble" class="air-bubble" role="status"></div>
    <section id="air-chat" class="air-chat" aria-label="Air 대화창" hidden>
      <header class="air-head">
        <span class="air-mark" aria-hidden="true">✦</span>
        <span class="air-who"><b>Air<small>에어</small></b><small id="air-status">AI 서버 확인 중</small></span>
        <button id="air-close" class="air-close" type="button" aria-label="닫기">×</button>
      </header>
      <div id="air-messages" class="air-messages"></div>
      <form id="air-form" class="air-form">
        <textarea id="air-input" rows="1" placeholder="무엇이든 물어보세요" autocomplete="off"></textarea>
        <button type="submit" aria-label="전송"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39 1.2L4 11l9 1-9 1-1.99 6.2a1 1 0 0 0 1.39 1.2z"/></svg></button>
      </form>
    </section>
    <button id="air-button" class="air-button" type="button" aria-label="Air(에어) 열기" aria-expanded="false">✦</button>
  </aside>

  <div id="air-confirm" class="air-confirm" hidden>
    <section class="air-confirm-card" role="dialog" aria-modal="true" aria-labelledby="air-confirm-title">
      <h2 id="air-confirm-title"><span class="air-confirm-icon" aria-hidden="true">✦</span>일정을 추가할까요?</h2>
      <pre id="air-confirm-details"></pre>
      <div class="air-confirm-actions">
        <button id="air-confirm-cancel" type="button" class="air-confirm-cancel">취소</button>
        <button id="air-confirm-ok" type="button" class="air-confirm-ok">추가</button>
      </div>
    </section>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="./api-config.js?v=20261111-drive"></script>
  <script src="./app.js?v=20261118-lavender"></script>
</body>
</html>
